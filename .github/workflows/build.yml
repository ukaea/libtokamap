name: Build & Test

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        release: [Debug, Release]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Non-Windows

      - name: Configure CMake (non-Windows)
        if: matrix.os != 'windows-latest'
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ matrix.release }} \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DENABLE_TESTING=ON -DENABLE_EXAMPLES=ON

      - name: Build (non-Windows)
        if: matrix.os != 'windows-latest'
        run: cmake --build build

      - name: Install (non-Windows)
        if: matrix.os != 'windows-latest'
        run: sudo cmake --install build

      # Windows

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DENABLE_TESTING=ON -DENABLE_EXAMPLES=ON

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build -j 8 --config ${{ matrix.release }}

      - name: Install (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --install build  --config ${{ matrix.release }}

      - name: Test
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Examples
        if: matrix.os != 'windows-latest'
        run: ./build/examples/simple_mapper/simple_mapper

      - name: Archive example trace
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: example-trace-${{ matrix.os }}-${{ matrix.release }}
          path: trace.json

  python-bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python with a shared libpython
          - os: ubuntu-latest
            python: setup-python
          - os: macos-latest
            python: setup-python
          # Distribution python3, which has libpython built into the executable
          - os: ubuntu-latest
            python: system
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: matrix.python == 'setup-python'
        with:
          python-version: "3.12"

      - name: Install system Python
        if: matrix.python == 'system'
        run: sudo apt-get update && sudo apt-get install -y python3-dev python3-venv

      - name: Create virtual environment
        run: |
          python3 -m venv venv
          venv/bin/pip install numpy

      - name: Configure CMake
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTING=ON \
            -DLIBTOKAMAP_BUILD_PYTHON_BRIDGE=ON -DPython3_EXECUTABLE=$PWD/venv/bin/python

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
