[package]
name = "libtokamap-rust"
version = "0.1.0"
edition = "2021"
authors = ["LibTokaMap Contributors"]
description = "Rust bindings for libtokamap C++ library"
license = "MIT"
repository = "https://github.com/your-org/libtokamap"
keywords = ["tokamak", "mapping", "physics", "data"]
categories = ["science", "api-bindings"]

[dependencies]
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[build-dependencies]
cxx-build = "1.0"

[lib]
name = "libtokamap_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
