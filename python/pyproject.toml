[build-system]
requires = ["setuptools>=61.0", "numpy>=2.0", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "libtokamap"
dynamic = ["version"]
description = "A library for flexible data mapping and transformation using TokaMap compatible mappings"
authors = [
    { name = "Jonathan Hollocombe", email = "jonathan.hollocombe@ukaea.uk" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "tokamap>=0.1.0",
    "numpy>=2.0",
]
keywords = [
    "tokamap",
    "validation",
    "schema",
    "experimental-data",
    "data-mapping",
    "json-schema",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.urls]
"Homepage" = "https://github.com/ukaea/libtokamap"
"Repository" = "https://github.com/ukaea/libtokamap"
"Issue Tracker" = "https://github.com/ukaea/libtokamap/issues"
"Documentation" = "https://github.com/ukaea/libtokamap#readme"

[tool.setuptools]
packages = ["libtokamap"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools_scm]
root = ".."
relative_to = "pyproject.toml"
version_file = "src/libtokamap/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.cibuildwheel]
test-requires = ["pytest>=8"]
test-command = "pytest {project}/tests -q"
